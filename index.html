<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الصراحة</title>
    <style>
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; font-family: 'Arial', sans-serif; 
            background-color: #ffc0cb; /* خلفية وردية */
            overflow: hidden; text-align: center;
        }
        h1 { color: #d63384; }
        .buttons { margin-top: 20px; position: relative; width: 100%; height: 300px; }
        button {
            padding: 15px 30px; font-size: 1.2rem; border: none; border-radius: 25px;
            cursor: pointer; transition: 0.1s; position: absolute;
        }
        #yesBtn { background-color: #2ecc71; color: white; left: 50%; transform: translateX(-110%); } /* أخضر */
        #noBtn { background-color: #ff0000; color: white; left: 50%; transform: translateX(10%); } /* أحمر */
        #result { display: none; }
        .quiz-gif { width: 200px; border-radius: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="quiz">
        <div id="gifSpace"></div>
        <h1 id="question">أحبك.. هل تحبني؟</h1>
        <p id="funnyText"></p>
        <div class="buttons">
            <button id="yesBtn" onclick="showSurprise()">نعم</button>
            <button id="noBtn" onmouseover="moveNo()" onclick="moveNo()">لا</button>
        </div>
    </div>

    <div id="result">
        <h1>كذبة أول أبريل! 😜</h1>
        <p>أصلاً كنت بمزح معك.. تعيش وتأكل غيرها!</p>
        <img class="quiz-gif" src="https://media.giphy.com/media/2g6sCTsSoVuSfSxK4W/giphy.gif" alt="Happy Cat">
    </div>

    <script>
        let noCount = 0;
        const funnyPhrases = ["لماذا تكرهني؟", "جرب مرة ثانية!"];
        const gifs = [
            "https://media.giphy.com/media/901mxGLGQN2PyCQpoc/giphy.gif", // جيف الفأر
            "https://media.giphy.com/media/Ev477g37MJORyOWfdG/giphy.gif"  // جيف الدب
        ];

        function moveNo() {
            if (noCount < 2) { 
                // إظهار الجيف في كل مرة يهرب فيها الزر
                document.getElementById('gifSpace').innerHTML = `<img class="quiz-gif" src="${gifs[noCount]}">`;
                
                // حركة الهروب
                const x = Math.random() * (window.innerWidth - 120);
                const y = Math.random() * (window.innerHeight - 150);
                const noBtn = document.getElementById('noBtn');
                noBtn.style.position = 'fixed'; // لضمان الهروب في كل الشاشة
                noBtn.style.left = x + 'px';
                noBtn.style.top = y + 'px';
                
                document.getElementById('funnyText').innerText = funnyPhrases[noCount];
                noCount++;
            } else {
                // اختفاء زر "لا" نهائياً وظهور أزرار "نعم" إضافية
                document.getElementById('noBtn').style.display = 'none';
                document.getElementById('funnyText').innerText = "لماذا تكرهني؟ ما في غير نعم هلق!";
                createExtraYes();
                createExtraYes();
            }
        }

        function createExtraYes() {
            const btn = document.createElement("button");
            btn.innerHTML = "نعم";
            btn.style.backgroundColor = "#2ecc71";
            btn.style.color = "white";
            btn.style.borderRadius = "25px";
            btn.style.padding = "15px 30px";
            btn.style.position = 'fixed';
            btn.style.left = Math.random() * 70 + "%";
            btn.style.top = Math.random() * 70 + "%";
            btn.onclick = showSurprise;
            document.body.appendChild(btn);
        }

        function showSurprise() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
